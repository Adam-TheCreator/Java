<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Diagram of a for loop over monsters containing a while loop with attack and run choices"><title>Diagram of a for loop over monsters containing a while loop with attack and run choices</title><rect width="1200" height="460" rx="14" fill="#14161f"/><text x="40" y="48" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="22" font-weight="700" fill="#e8e6df" text-anchor="start">HOW A DUNGEON RUN WORKS</text><text x="40" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" fill="#9aa0b4" text-anchor="start">The loop inside a loop at the heart of Project 2</text><rect x="40" y="100" width="1120" height="330" rx="12" fill="#1e2230" stroke="#f2b134" stroke-width="2"/><text x="64" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="18" font-weight="700" fill="#f2b134" text-anchor="start">for each monster in the group</text><text x="1136" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" font-weight="400" fill="#9aa0b4" text-anchor="end">moves to the next monster</text><rect x="80" y="156" width="1040" height="250" rx="12" fill="#14161f" stroke="#2fb5a8" stroke-width="2"/><text x="104" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="18" font-weight="700" fill="#2fb5a8" text-anchor="start">while this monster has health</text><text x="1096" y="190" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="14" font-weight="400" fill="#9aa0b4" text-anchor="end">keeps this fight going</text><rect x="120" y="212" width="960" height="52" rx="8" fill="#1e2230" stroke="#343a4f"/><text x="600" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="17" font-weight="400" fill="#e8e6df" text-anchor="middle">ask: "attack or run!"</text><rect x="120" y="282" width="468" height="102" rx="10" fill="#1e2230" stroke="#e4572e" stroke-width="2"/><text x="144" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="18" font-weight="700" fill="#e4572e" text-anchor="start">attack</text><text x="144" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" fill="#e8e6df" text-anchor="start">health goes down by hit power</text><text x="144" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" fill="#9aa0b4" text-anchor="start">at 0 or below: gold drops</text><rect x="612" y="282" width="468" height="102" rx="10" fill="#1e2230" stroke="#9d7bea" stroke-width="2"/><text x="636" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="18" font-weight="700" fill="#9d7bea" text-anchor="start">run</text><text x="636" y="342" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" fill="#e8e6df" text-anchor="start">break out of this fight</text><text x="636" y="366" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,monospace" font-size="15" font-weight="400" fill="#9aa0b4" text-anchor="start">no gold, on to the next monster</text></svg>